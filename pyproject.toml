# An actual build requirement selects the wheel source; a constraint only limits versions.
[tool.uv.extra-build-dependencies]
fairseq = [
    "torch @ https://download-r2.pytorch.org/whl/cu121/torch-2.5.1%2Bcu121-cp311-cp311-linux_x86_64.whl#sha256=c8ab8c92eab928a93c483f83ca8c63f13dafc10fc93ad90ed2dcb7c82ea50410",
]

[tool.uv.sources]
# Original PyPI artifact recovered from its cached index entry; release metadata is unavailable.
onnxruntime-gpu = { url = "https://files.pythonhosted.org/packages/17/29/d4f2122c3d1150b191b3219c1b3e99e1e12ea377d2d810ea9482c17587f1/onnxruntime_gpu-1.24.2-cp311-cp311-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl" }
# Match the working installed fork exactly; PyPI fairseq is a different build.
fairseq = { git = "https://github.com/One-sixth/fairseq.git", rev = "44800430a728c2216fd1cf1e8daa672f50dfacba" }
torch = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
