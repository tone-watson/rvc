# Farm Linux runtime; farm.json owns the application release version.
[project]
name = "farm-rvc-runtime"
version = "0.0.0"
requires-python = "==3.11.*"
dependencies = [
    "torch==2.5.1+cu121",
    "torchaudio==2.5.1+cu121",
    "torchvision==0.20.1+cu121",
    "fairseq==0.12.3",
    "gradio==3.34.0",
    "librosa==0.10.2",
    "faiss-cpu==1.13.2",
    "pyworld==0.3.2",
